[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callsense"
version = "0.1.0"
description = "Call Center Intelligence System — LangGraph pipeline for call audio QA, compliance, and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    # orchestration
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-core>=0.3",
    # LLM providers (all three required by the provider factory)
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    # observability
    "langsmith>=0.1",
    # speech-to-text
    "faster-whisper>=1.0",
    # av 19 dropped open()'s metadata_errors argument, which faster-whisper 1.2.1
    # still passes, so every transcription raises TypeError. Lift once it is fixed.
    "av<19",
    # audio metadata for non-WAV formats
    "mutagen>=1.47",
    "soundfile>=0.12",
    "numpy>=1.26",
    # data contracts
    "pydantic>=2.7",
    # persistence
    "sqlalchemy>=2.0",
    # reports
    "reportlab>=4.1",
    # ui — pinned to 5.x: the rubric names Gradio 5.x and the Milestone 6 API guidance
    # (gr.Audio sources, .click().then().then(), Dataframe/tab-select wiring) assumes it
    "gradio>=5.0,<6.0",
    # config
    "python-dotenv>=1.0",
    # mcp server — 2.x, where FastMCP became MCPServer
    "mcp>=2.3,<3",
    # Jev, scan_text's second injection check. The server imports it at startup,
    # so an install without it could not start the server at all.
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
callsense-mcp = "src.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: end-to-end pipeline tests (mocked Whisper + LLM)",
    "security: PII and prompt-injection coverage",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Spikes are throwaway print-debugging scripts kept only as evidence for the
# decisions they drove. Wide print lines are the point; undefined names and
# unused imports are still worth catching.
"_spikes/*" = ["E501", "B007"]
# Kept as it ran, so the record matches the results beside it. Formatted by
# ruff; its lint findings are style only.
"evals/public/pilot/*" = ["E501", "SIM115"]
